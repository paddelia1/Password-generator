; =====================================================================
;  Template for secrets.ini
;
;  Copy this file to  secrets.ini  and replace the placeholders with
;  your real values. secrets.ini is listed in .gitignore and must
;  never be committed; this template is safe to track.
;
;  Each key under [Snippets] is an AutoHotkey hotkey. Pressing it types
;  the value verbatim via SendText, so NO AutoHotkey escaping is needed:
;  write  !  #  ^  +  {  }  as themselves, not as {!} {#} {^} etc.
;
;  Parser limits:
;    - Leading/trailing spaces are stripped from values.
;    - A value cannot start with ';' (it would read as a comment).
;    - '=' inside a value is fine; only the first '=' splits key/value.
;
;  Hotkey syntax: ^ = Ctrl, ! = Alt, + = Shift, # = Win
; =====================================================================

[Snippets]
^1=some phrase you type often
^2=replace-with-a-password
^3=Your Name
^4=you@example.com
^5=replace-with-a-password
^7=https://www.example.com/your-profile/
^8=replace-with-an-api-key
^9=replace-with-a-password
^0=replace-with-a-password
^g=personal@example.com
^t=work@example.com
^u=you@example.com
